# /etc/postgresql/18/main/conf.d/90-lab.conf
# Параметры primary-узла лабораторного кластера

listen_addresses = '*'
port = 5432

# память (ВМ: 4 GB RAM)
shared_buffers = 512MB
effective_cache_size = 1536MB
work_mem = 16MB
maintenance_work_mem = 128MB

# WAL / репликация
wal_level = replica
max_wal_senders = 10
max_replication_slots = 10
wal_keep_size = 128MB
hot_standby = on

# расширения Percona
shared_preload_libraries = 'pgaudit,pg_stat_monitor'

# логирование и аудит
log_min_duration_statement = 200ms
log_checkpoints = on
log_connections = on
log_disconnections = on
log_line_prefix = '%m [%p] %q%u@%d '
track_io_timing = on
pgaudit.log = 'write, ddl'

# архивирование WAL
archive_mode = on
archive_command = 'pgbackrest --stanza=lab archive-push %p'
archive_timeout = 60
